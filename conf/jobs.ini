[DEFAULT]
logfile=/opt/nDeploy/watcher.log
pidfile=/opt/nDeploy/watcher.pid

[job1]
label=Watch /etc/ips
watch=/etc/ips
events=modify
recursive=false
autoadd=true
excluded=
command=/opt/nDeploy/scripts/generate_default_vhost_config.py

[job2]
label=Watch /var/named/cache
watch=/var/named/cache
events=move_to
recursive=false
autoadd=true
excluded=
command=/opt/nDeploy/scripts/sync_gdnsd_zone.sh $filename
